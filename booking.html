<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment - Sakshi Makeover</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #ffffff; width: 100%; max-width: 480px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 28px; }
    .header { text-align: center; margin-bottom: 22px; }
    .header h1 { font-size: 22px; color: #0f766e; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 12px; color: #64748b; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    input[type="text"], input[type="tel"], input[type="datetime-local"] {
      width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s;
    }
    input:focus { border-color: #0f766e; }
    
    #selectedServicesBox { display: none; background: #f8fafc; border: 1.5px solid #0f766e; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .sel-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
    .btn-qty { width: 24px; height: 24px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .btn-minus { background: #fee2e2; color: #dc2626; }
    .btn-plus { background: #e0e7ff; color: #4f46e5; }
    
    #catalogBox { max-height: 190px; overflow-y: auto; border: 1.5px solid #cbd5e1; border-radius: 10px; background: #fff; padding: 4px; }
    .cat-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #f1f5f9; }
    .btn-add { background: #e6fffa; color: #0d9488; border: 1px solid #99f6e4; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: bold; cursor: pointer; }
    
    .btn-submit { width: 100%; background: #0f766e; color: white; padding: 13px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-submit:hover { background: #115e59; }
    .success-card { display: none; text-align: center; padding: 20px 0; }
    .success-card h2 { color: #0f766e; margin-bottom: 8px; font-size: 20px; }
  </style>
</head>
<body>
  <div class="card" id="formCard">
    <div class="header">
      <h1>Sakshi Makeover & Unisex Salon</h1>
      <p>Laxmi Nagar, Delhi | Book Your Slot Online</p>
    </div>

    <form id="bookForm">
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="name" required placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label>WhatsApp Number</label>
        <input type="tel" id="phone" required placeholder="10-digit mobile number">
      </div>

      <div class="form-group">
        <label>Preferred Services (Add Services & Quantity)</label>
        <input type="hidden" id="service" required>
        
        <input type="text" id="searchService" placeholder="🔍 Type to search (e.g. Makeup, Facial, Haircut)..." oninput="filterCatalog()" style="margin-bottom: 8px;">

        <div id="selectedServicesBox">
          <div style="font-size: 11px; font-weight: bold; color: #0f766e; margin-bottom: 8px;">SELECTED SERVICES:</div>
          <div id="selectedList"></div>
        </div>

        <div id="catalogBox"></div>
      </div>

      <div class="form-group">
        <label>Preferred Date & Time</label>
        <input type="datetime-local" id="time" required>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Confirm Appointment 📅</button>
    </form>

    <div class="success-card" id="successBox">
      <h2>🎉 Appointment Received!</h2>
      <p style="color: #475569; font-size: 14px; margin-bottom: 8px;">Thank you! Your booking request has been forwarded to <b>Sakshi Makeover & Unisex Salon</b>.</p>
      <p style="color: #64748b; font-size: 12px;">We look forward to seeing you!</p>
    </div>
  </div>

  <script>
    const salonCatalog = [
      { name: "Haircut (Men)", cat: "Men's Grooming", price: 120 },
      { name: "Clean Shave", cat: "Men's Grooming", price: 60 },
      { name: "Beard Trim & Styling", cat: "Men's Grooming", price: 80 },
      { name: "Head Massage (Oil)", cat: "Men's Grooming", price: 150 },
      { name: "Threading (Eyebrows)", cat: "Thread Work", price: 30 },
      { name: "Upper Lip Threading", cat: "Thread Work", price: 20 },
      { name: "Full Face Wax", cat: "Waxing", price: 250 },
      { name: "Underarms Wax (Normal)", cat: "Waxing", price: 60 },
      { name: "Full Arms Wax (RICA)", cat: "Waxing", price: 350 },
      { name: "Full Legs Wax (RICA)", cat: "Waxing", price: 600 },
      { name: "Fruit Clean-Up", cat: "Clean-Up", price: 299 },
      { name: "D-Tan Clean-Up", cat: "Clean-Up", price: 399 },
      { name: "Fruit Facial", cat: "Facial", price: 499 },
      { name: "Gold Radiance Facial", cat: "Facial", price: 799 },
      { name: "O3+ Bridal Glow Facial", cat: "Facial", price: 1499 },
      { name: "Party Makeup", cat: "Makeup & Styling", price: 2000 },
      { name: "Engagement Makeup", cat: "Makeup & Styling", price: 4500 },
      { name: "Bridal Makeup", cat: "Makeup & Styling", price: 15000 },
      { name: "Reception Makeup", cat: "Makeup & Styling", price: 6000 },
      { name: "Hair Styling / Curls / Bun", cat: "Makeup & Styling", price: 500 },
      { name: "Saree / Dupatta Draping", cat: "Makeup & Styling", price: 300 },
      { name: "Root Touch-Up", cat: "Hair Colour", price: 600 },
      { name: "Global Hair Color", cat: "Hair Colour", price: 1800 },
      { name: "Hair Spa (L'Oreal)", cat: "Hair Spa", price: 599 },
      { name: "Keratin Treatment", cat: "Hair Treatments", price: 2999 },
      { name: "Rebonding / Smoothening", cat: "Hair Treatments", price: 3499 },
      { name: "Botox Hair Treatment", cat: "Hair Treatments", price: 3999 }
    ];

    const selectedServices = {};

    function renderCatalog(items) {
      const box = document.getElementById('catalogBox');
      box.innerHTML = '';
      if (items.length === 0) {
        box.innerHTML = '<div style="padding: 12px; color: #94a3b8; text-align: center; font-size: 12px;">Koi service nahi mili</div>';
        return;
      }
      items.forEach(it => {
        const qty = selectedServices[it.name] || 0;
        const row = document.createElement('div');
        row.className = 'cat-row';
        row.innerHTML = `
          <div>
            <div style="font-weight: 600; font-size: 13px; color: #1e293b;">${it.name}</div>
            <div style="font-size: 11px; color: #64748b;">${it.cat} • Rs. ${it.price}</div>
          </div>
          <div style="display: flex; align-items: center; gap: 6px;">
            ${qty > 0 ? `<span style="background: #0f766e; color: white; border-radius: 4px; padding: 2px 6px; font-size: 10px; font-weight: bold;">${qty}</span>` : ''}
            <button type="button" class="btn-add" onclick="addService('${it.name}')">+ Add</button>
          </div>
        `;
        box.appendChild(row);
      });
    }

    function updateSelectedUI() {
      const box = document.getElementById('selectedServicesBox');
      const list = document.getElementById('selectedList');
      list.innerHTML = '';
      const keys = Object.keys(selectedServices);

      if (keys.length === 0) {
        box.style.display = 'none';
        document.getElementById('service').value = '';
        return;
      }

      box.style.display = 'block';
      keys.forEach(k => {
        const qty = selectedServices[k];
        const div = document.createElement('div');
        div.className = 'sel-item';
        div.innerHTML = `
          <span style="font-weight: 600; color: #0f172a;">${k}</span>
          <div style="display: flex; align-items: center; gap: 8px;">
            <button type="button" class="btn-qty btn-minus" onclick="removeService('${k}')">-</button>
            <span style="font-weight: bold; color: #0f766e;">${qty}</span>
            <button type="button" class="btn-qty btn-plus" onclick="addService('${k}')">+</button>
          </div>
        `;
        list.appendChild(div);
      });

      document.getElementById('service').value = keys.map(k => selectedServices[k] > 1 ? `${k} x ${selectedServices[k]}` : k).join(', ');
    }

    window.addService = function(name) {
      selectedServices[name] = (selectedServices[name] || 0) + 1;
      updateSelectedUI();
      filterCatalog();
    };

    window.removeService = function(name) {
      if (selectedServices[name] > 1) {
        selectedServices[name]--;
      } else {
        delete selectedServices[name];
      }
      updateSelectedUI();
      filterCatalog();
    };

    window.filterCatalog = function() {
      const q = (document.getElementById('searchService').value || '').toLowerCase().trim();
      const f = salonCatalog.filter(s => s.name.toLowerCase().includes(q) || s.cat.toLowerCase().includes(q));
      renderCatalog(f);
    };

    renderCatalog(salonCatalog);

    document.getElementById('bookForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const sVal = document.getElementById('service').value;
      if (!sVal) {
        alert('Kripya catalog me se kam se kam ek service Add karein!');
        return;
      }
      const btn = document.getElementById('submitBtn');
      btn.innerText = 'Submitting...';
      btn.disabled = true;

      const payload = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        service: sVal,
        time: document.getElementById('time').value
      };

      try {
        const res = await fetch('/api/book', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          document.getElementById('bookForm').style.display = 'none';
          document.getElementById('successBox').style.display = 'block';
        } else {
          alert('Error booking appointment.');
          btn.innerText = 'Confirm Appointment 📅';
          btn.disabled = false;
        }
      } catch (err) {
        alert('Server unreachable.');
        btn.innerText = 'Confirm Appointment 📅';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
